[package]
name = "vask"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ask questions about YouTube videos with Gemini's native video understanding"
repository = "https://github.com/StarbirdTech/vask"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "1"

[dev-dependencies]
tempfile = "3"
